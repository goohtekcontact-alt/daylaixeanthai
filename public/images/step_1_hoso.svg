<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E01E00"/>
      <stop offset="50%" stop-color="#C00A00"/>
      <stop offset="100%" stop-color="#8E0500"/>
    </linearGradient>
    <linearGradient id="paperGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#9C0600" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="shine1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Document Paper Body -->
  <rect x="26" y="16" width="68" height="92" rx="12" fill="url(#paperGrad1)" filter="url(#shadow1)" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="26" y="16" width="68" height="92" rx="12" fill="url(#shine1)"/>

  <!-- Folded Top Right Corner -->
  <path d="M72 16 L94 38 L78 38 Q72 38 72 32 Z" fill="#CBD5E1"/>

  <!-- Content Lines -->
  <rect x="36" y="32" width="28" height="7" rx="3.5" fill="url(#redGrad1)"/>
  <rect x="36" y="47" width="48" height="6" rx="3" fill="#94A3B8"/>
  <rect x="36" y="59" width="40" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="36" y="71" width="44" height="6" rx="3" fill="#CBD5E1"/>

  <!-- 3D Red Seal/Badge Overlay -->
  <circle cx="84" cy="84" r="22" fill="url(#redGrad1)" filter="url(#shadow1)"/>
  <circle cx="84" cy="84" r="22" fill="url(#shine1)"/>
  <path d="M74 84 L81 91 L94 77" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
