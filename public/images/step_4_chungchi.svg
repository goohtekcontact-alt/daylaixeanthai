  <!-- Hanging Ribbons -->
  <path d="M46 64 L34 112 L54 100 L72 112 L64 64 Z" fill="url(#redGrad4)" filter="url(#shadow4)"/>
  <path d="M82 64 L70 112 L88 100 L106 112 L94 64 Z" fill="url(#redGrad4)" filter="url(#shadow4)"/>

  <!-- Medal Outer Circle Body -->
  <circle cx="64" cy="52" r="38" fill="url(#redGrad4)" filter="url(#shadow4)"/>
  <circle cx="64" cy="52" r="38" fill="url(#shine4)"/>

  <!-- Gold Ring -->
  <circle cx="64" cy="52" r="30" fill="none" stroke="url(#goldGrad4)" stroke-width="5"/>
  <circle cx="64" cy="52" r="22" fill="url(#shine4)"/>

  <!-- Star in Center -->
  <path d="M64 38 L68.5 47.5 L79 49 L71.5 56.5 L73.2 67 L64 62 L54.8 67 L56.5 56.5 L49 49 L59.5 47.5 Z" fill="url(#goldGrad4)"/>
