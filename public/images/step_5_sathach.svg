<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E01E00"/>
      <stop offset="50%" stop-color="#C00A00"/>
      <stop offset="100%" stop-color="#8E0500"/>
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73"/>
      <stop offset="100%" stop-color="#D49B00"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#9C0600" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="shine5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Skull Cap Base Underneath -->
  <path d="M38 66 L38 84 C38 94 90 94 90 84 L90 66 C78 72 50 72 38 66 Z" fill="url(#redGrad5)" opacity="0.9"/>

  <!-- Main Diamond Cap Top -->
  <path d="M64 22 L116 46 L64 70 L12 46 Z" fill="url(#redGrad5)" filter="url(#shadow5)"/>
  <path d="M64 22 L116 46 L64 70 L12 46 Z" fill="url(#shine5)"/>

  <!-- Center Button -->
  <circle cx="64" cy="46" r="6" fill="url(#goldGrad5)"/>

  <!-- Tassel String -->
  <path d="M64 46 Q 92 48 96 74" stroke="url(#goldGrad5)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Tassel Fringe -->
  <path d="M92 74 L100 74 L98 96 L90 96 Z" fill="url(#goldGrad5)"/>
</svg>
